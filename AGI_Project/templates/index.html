<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Core — Nexora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --accent-dim: #1f6feb;
            --green: #3fb950;
            --orange: #d29922;
            --red: #f85149;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        header h1 span { color: var(--accent); }
        header .badge {
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent-dim);
            color: #fff;
        }
        .msg.assistant {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .msg.error {
            align-self: center;
            background: rgba(248,81,73,0.1);
            border: 1px solid var(--red);
            color: var(--red);
            font-size: 13px;
        }
        .steps {
            align-self: flex-start;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .step {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--orange);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.5;
        }
        .step .step-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .step .step-num {
            color: var(--orange);
            font-weight: 600;
            font-size: 11px;
        }
        .step .step-tool {
            color: var(--accent);
            font-weight: 600;
        }
        .step .step-query {
            color: var(--text-dim);
            font-style: italic;
        }
        .step .step-result {
            color: var(--green);
            margin-top: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .typing {
            align-self: flex-start;
            color: var(--text-dim);
            font-size: 14px;
            padding: 12px 16px;
        }
        .typing span {
            display: inline-block;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
        #input-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
        }
        #input-bar form {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }
        #input-bar input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        #input-bar input:focus { border-color: var(--accent); }
        #input-bar button {
            background: var(--accent-dim);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        #input-bar button:hover { opacity: 0.85; }
        #input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
        .reset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .reset-btn:hover { border-color: var(--text-dim); color: var(--text); }
    </style>
</head>
<body>
    <header>
        <h1>🧠 <span>AGI Core</span> — Nexora</h1>
        <button class="reset-btn" onclick="resetSession()">New Session</button>
    </header>
    <div id="chat">
        <div class="msg assistant">
            AGI Core initialized (V8.1). I have access to tools: calculator, web search, YouTube search, file system, Python runner, and memory. Ask me anything!
        </div>
    </div>
    <div id="input-bar">
        <form id="form" onsubmit="return sendMessage(event)">
            <input type="text" id="input" placeholder="Ask the AGI agent..." autocomplete="off" autofocus />
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>
    <script>
        let sessionId = null;
        const chat = document.getElementById('chat');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');

        function scrollDown() {
            chat.scrollTop = chat.scrollHeight;
        }

        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            chat.appendChild(div);
            scrollDown();
            return div;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing';
            div.innerHTML = 'System is thinking<span>.</span><span>.</span><span>.</span>';
            chat.appendChild(div);
            scrollDown();
        }

        function removeTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }

        function addSteps(steps) {
            if (!steps.length) return;
            const container = document.createElement('div');
            container.className = 'steps';
            for (const s of steps) {
                const div = document.createElement('div');
                div.className = 'step';
                let html = '<div class="step-header">';
                html += `<span class="step-num">STEP ${s.step}</span>`;
                html += `<span class="step-tool">🔧 ${s.tool}</span>`;
                html += `</div>`;
                html += `<div class="step-query">Query: ${escapeHtml(s.query)}</div>`;
                if (s.result) {
                    html += `<div class="step-result">⚙️ ${escapeHtml(s.result)}</div>`;
                }
                div.innerHTML = html;
                container.appendChild(div);
            }
            chat.appendChild(container);
            scrollDown();
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return false;
            input.value = '';
            sendBtn.disabled = true;
            addMsg('user', text);
            addTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });
                const data = await res.json();
                removeTyping();
                if (data.error) {
                    addMsg('error', data.error);
                } else {
                    sessionId = data.session_id;
                    addSteps(data.steps || []);
                    addMsg('assistant', data.answer);
                }
            } catch (err) {
                removeTyping();
                addMsg('error', 'Connection error: ' + err.message);
            }
            sendBtn.disabled = false;
            input.focus();
            return false;
        }

        async function resetSession() {
            if (sessionId) {
                await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
            }
            sessionId = null;
            chat.innerHTML = '<div class="msg assistant">Session reset. Ask me anything!</div>';
        }
    </script>
</body>
</html>
